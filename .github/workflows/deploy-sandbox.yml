name: Deploy to sandbox (manual)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to deploy (defaults to the branch you run this on)
        required: false

jobs:
  deploy:
    name: Deploy — sandbox
    runs-on: ubuntu-latest
    environment: sandbox
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: infra/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: infra/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Configure AWS credentials (sandbox)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_SANDBOX_ROLE_ARN }}
          aws-region: eu-west-2
      - run: pnpm run ci-deploy-sandbox
