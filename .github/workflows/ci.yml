name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Validate the post-merge state on PRs so CI catches what will land on main.
env:
  CHECKOUT_REF: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/merge', github.event.pull_request.number) || github.sha }}

jobs:
  infra:
    name: Infra — type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}
      # pnpm must be set up before setup-node so its store can be cached.
      # Version is pinned via infra/package.json "packageManager" field.
      # The lockfile is registry-agnostic (integrity only, no resolved URLs),
      # so it works in CI without access to the home Nexus proxy.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: infra/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: infra/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit

  synth:
    name: CDK synth (sandbox)
    runs-on: ubuntu-latest
    needs: infra
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: infra/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: infra/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Configure AWS credentials (sandbox)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_SANDBOX_ROLE_ARN }}
          aws-region: eu-west-2
      - run: pnpm run ci-synth-sandbox

  deploy-sandbox:
    name: Deploy — sandbox
    runs-on: ubuntu-latest
    needs: synth
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment: sandbox
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: infra/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: infra/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Configure AWS credentials (sandbox)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_SANDBOX_ROLE_ARN }}
          aws-region: eu-west-2
      - run: pnpm run ci-deploy-sandbox

  deploy-prod:
    name: Deploy — production
    runs-on: ubuntu-latest
    needs: deploy-sandbox
    if: github.event_name == 'push'
    environment: production
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: infra/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: infra/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Configure AWS credentials (production)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PROD_ROLE_ARN }}
          aws-region: eu-west-2
      - run: pnpm run ci-deploy-prod

  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [infra, synth, deploy-sandbox, deploy-prod]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          results='${{ toJson(needs) }}'
          if echo "$results" | grep -q '"result":"failure"'; then
            echo "One or more jobs failed" && exit 1
          fi
          echo "All jobs passed or were skipped"
